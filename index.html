<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>CACTUC LUDO KING 👑</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <!-- HEADER -->
    <header class="topbar">

        <div class="brand">
            <h1>CACTUC</h1>
            <p id="subtitle">CACTUC LUDO KING 👑</p>
        </div>

        <button id="settingsBtn" class="iconBtn">
            ⚙️
        </button>

    </header>


    <!-- MAIN MENU -->
    <main id="menu" class="screen">

        <div class="logoBox">
            <div class="crown">👑</div>
            <h2>CACTUC</h2>
            <p id="welcomeText">دنیای بازی و سرگرمی</p>
        </div>

        <button id="createRoomBtn" class="mainBtn">
            🏠 ساخت اتاق جدید
        </button>

        <button id="joinRoomBtn" class="mainBtn">
            🔑 ورود به اتاق
        </button>

        <button id="computerBtn" class="mainBtn">
            🤖 بازی با کامپیوتر
        </button>

        <button id="quickGameBtn" class="secondaryBtn">
            ⚡ بازی سریع
        </button>

    </main>


    <!-- PLAYER COUNT -->
    <section id="playerCountScreen" class="screen hidden">

        <div class="panel">

            <h2 id="playerCountTitle">
                👥 چند نفر بازی می‌کنند؟
            </h2>

            <button class="countBtn" data-count="1">
                🤖 ۱ نفره
                <small>شما در برابر کامپیوتر</small>
            </button>

            <button class="countBtn" data-count="2">
                👥 ۲ نفره
                <small>دو بازیکن</small>
            </button>

            <button class="countBtn" data-count="3">
                👥 ۳ نفره
                <small>سه بازیکن</small>
            </button>

            <button class="countBtn" data-count="4">
                👥 ۴ نفره
                <small>چهار بازیکن</small>
            </button>

            <button id="countBackBtn" class="backBtn">
                ← برگشت
            </button>

        </div>

    </section>


    <!-- CREATE ROOM -->
    <section id="roomScreen" class="screen hidden">

        <div class="panel">

            <h2 id="roomTitle">
                🏠 اتاق بازی
            </h2>

            <div class="roomCode">

                <small id="roomCodeLabel">
                    کد اتاق
                </small>

                <strong id="roomCode">
                    ------
                </strong>

            </div>

            <button id="copyCodeBtn" class="secondaryBtn">
                📋 کپی کد
            </button>

            <div id="roomPlayers"></div>

            <button id="startBtn" class="mainBtn">
                ▶️ شروع بازی
            </button>

            <button id="roomBackBtn" class="backBtn">
                ← برگشت
            </button>

        </div>

    </section>


    <!-- JOIN ROOM -->
    <section id="joinScreen" class="screen hidden">

        <div class="panel">

            <h2 id="joinTitle">
                🔑 ورود به اتاق
            </h2>

            <input
                id="roomInput"
                maxlength="6"
                inputmode="numeric"
                autocomplete="off"
                placeholder="کد ۶ رقمی"
            >

            <button id="joinBtn" class="mainBtn">
                ورود
            </button>

            <button id="backBtn" class="backBtn">
                ← برگشت
            </button>

        </div>

    </section>


    <!-- GAME -->
    <section id="gameScreen" class="hidden">

        <!-- CURRENT TURN -->
        <div class="turnBar">

            <div>
                <small id="turnLabel">
                    نوبت
                </small>

                <strong id="turnText">
                    قرمز
                </strong>
            </div>

            <div id="gameMessage">
                تاس را بزن
            </div>

        </div>


        <!-- PLAYER CARDS -->
        <div id="playersBar" class="playersBar"></div>


        <!-- LUDO BOARD -->
        <div class="boardWrap">

            <div id="board" class="board">
            </div>

        </div>


        <!-- DICE AREA -->
        <div class="gameControls">

            <div class="controlInfo">

                <strong id="activePlayerName">
                    🔴 قرمز
                </strong>

                <small id="rollHint">
                    برای حرکت تاس را بزن
                </small>

            </div>

            <button id="diceBtn" class="diceBtn">

                <span id="diceFace">
                    ⚀
                </span>

                <small id="diceLabel">
                    تاس
                </small>

            </button>

        </div>


        <button id="leaveGameBtn" class="leaveBtn">
            ✕ خروج از بازی
        </button>

    </section>


    <!-- WINNER -->
    <section id="winnerScreen" class="screen hidden">

        <div class="winnerBox">

            <div id="winnerCrown">
                👑
            </div>

            <h1 id="winnerTitle">
                برنده!
            </h1>

            <div id="winnerName">
                🔴 قرمز
            </div>

            <div id="ranking"></div>

            <button id="newGameBtn" class="mainBtn">
                🎮 بازی جدید
            </button>

            <button id="winnerMenuBtn" class="secondaryBtn">
                🏠 منوی اصلی
            </button>

        </div>

    </section>


    <!-- SETTINGS -->
    <section id="settings" class="modal hidden">

        <div class="settingsBox">

            <h2 id="settingsTitle">
                ⚙️ تنظیمات
            </h2>

            <h3 id="languageTitle">
                🌐 زبان
            </h3>

            <button data-lang="fa">
                🇮🇷 فارسی
            </button>

            <button data-lang="en">
                🇬🇧 English
            </button>

            <button data-lang="ar">
                🇸🇦 العربية
            </button>

            <button data-lang="de">
                🇩🇪 Deutsch
            </button>

            <button data-lang="ru">
                🇷🇺 Русский
            </button>

            <button id="closeSettings">
                بستن
            </button>

        </div>

    </section>


    <!-- FOOTER -->
    <footer class="footer">

        <span id="creatorText">
            سازنده: نــوید = Cactuc
        </span>

    </footer>

</div>


<script src="game.js"></script>

</body>
</html>

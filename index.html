<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CACTUC LUDO KING</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="brand">CACTUC</div>
    <button id="settingsBtn" class="settings">⚙️</button>
</header>

<section id="menu" class="menu">

    <h2>CACTUC LUDO KING</h2>
    <p class="welcome">به بازی لودو کاکتوس خوش آمدید 👑</p>

    <button id="createRoomBtn" class="menuBtn">🏠 ساخت اتاق</button>
    <button id="joinRoomBtn" class="menuBtn">🔑 ورود به اتاق</button>
    <button id="computerBtn" class="menuBtn">🤖 بازی با کامپیوتر</button>

    <div class="creator">
        <div>سازنده: نــوید = Cactuc</div>
        <div class="username" dir="ltr">@cactuc580</div>
    </div>

</section>

<section id="roomScreen" class="hidden screen">

    <h2>🏠 اتاق بازی</h2>

    <div class="roomCode">
        <small>کد اتاق</small>
        <strong id="roomCode">------</strong>
    </div>

    <button id="copyCodeBtn" class="menuBtn">📋 کپی کد</button>

    <div id="roomPlayers"></div>

    <div class="roomCount">
        <p>تعداد بازیکنان</p>
        <button data-count="2">۲ نفر</button>
        <button data-count="3">۳ نفر</button>
        <button data-count="4">۴ نفر</button>
    </div>

    <button id="startBtn" class="menuBtn">▶️ شروع بازی</button>
    <button id="backBtn" class="darkBtn">برگشت</button>

</section>

<section id="joinScreen" class="hidden screen">

    <h2>🔑 ورود به اتاق</h2>

    <input id="roomInput"
           maxlength="6"
           inputmode="numeric"
           placeholder="کد ۶ رقمی">

    <button id="joinBtn" class="menuBtn">ورود</button>
    <button id="backJoinBtn" class="darkBtn">برگشت</button>

</section>

<section id="gameScreen" class="hidden">

    <div class="gameTop">
        <div>
            <div class="gameTitle">CACTUC LUDO KING 👑</div>
            <div id="turnText">نوبت قرمز</div>
        </div>
        <div id="rankText"></div>
    </div>

    <div id="board" class="board"></div>

    <div id="playersPanel"></div>

    <div id="gameMessage">نوبت تو — تاس را بزن 🎲</div>

</section>

<section id="settings" class="modal hidden">

    <div class="settingsBox">

        <h2>⚙️ تنظیمات</h2>

        <button data-lang="fa">🇮🇷 فارسی</button>
        <button data-lang="en">🇬🇧 English</button>
        <button data-lang="ar">🇸🇦 العربية</button>
        <button data-lang="de">🇩🇪 Deutsch</button>
        <button data-lang="ru">🇷🇺 Русский</button>

        <button id="closeSettings">بستن</button>

    </div>

</section>

<script src="game.js"></script>

</body>
</html>

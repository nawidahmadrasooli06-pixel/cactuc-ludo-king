<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>CACTUC LUDO KING 👑</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <h1>CACTUC</h1>
      <div class="brand-sub">LUDO KING 👑</div>
    </div>
    <button id="settingsBtn" class="iconBtn">⚙️</button>
  </header>
  <!-- MAIN MENU -->
  <main id="menu" class="screen">
    <div class="welcome">
      <div class="cactus">🌵</div>
      <h2>خوش آمدی به CACTUC LUDO KING</h2>
      <p>
        آماده‌ای برای یک بازی واقعی لودو؟
      </p>
    </div>
    <button id="quickGameBtn" class="mainBtn">
      ⚡ بازی سریع
    </button>
    <button id="computerBtn" class="mainBtn">
      🤖 بازی با کامپیوتر
    </button>
    <button id="createRoomBtn" class="mainBtn">
      🏠 ساخت اتاق
    </button>
    <button id="joinRoomBtn" class="mainBtn">
      🔑 ورود به اتاق
    </button>
    <div class="creator">
      <div>سازنده: نــوید = Cactuc</div>
      <a href="https://t.me/cactuc580" target="_blank">
        @cactuc580
      </a>
    </div>
  </main>
  <!-- PLAYER COUNT -->
  <section id="playerCountScreen" class="screen hidden">
    <h2>👥 تعداد بازیکنان</h2>
    <button class="countBtn" data-count="2">
      👤 2 نفره
    </button>
    <button class="countBtn" data-count="3">
      👥 3 نفره
    </button>
    <button class="countBtn" data-count="4">
      👥 4 نفره
    </button>
    <button id="countBackBtn" class="secondaryBtn">
      برگشت
    </button>
  </section>
  <!-- ROOM -->
  <section id="roomScreen" class="screen hidden">
    <h2>🏠 اتاق بازی</h2>
    <div class="roomCard">
      <small>کد اتاق</small>
      <strong id="roomCode">
        ------
      </strong>
      <button id="copyCodeBtn">
        📋 کپی کد
      </button>
    </div>
    <div id="roomPlayers"></div>
    <button id="startRoomBtn" class="mainBtn">
      ▶️ شروع بازی
    </button>
    <button id="roomBackBtn" class="secondaryBtn">
      برگشت
    </button>
  </section>
  <!-- JOIN -->
  <section id="joinScreen" class="screen hidden">
    <h2>🔑 ورود به اتاق</h2>
    <input
      id="roomInput"
      type="text"
      maxlength="6"
      inputmode="numeric"
      placeholder="کد ۶ رقمی اتاق"
    >
    <button id="joinBtn" class="mainBtn">
      ورود به اتاق
    </button>
    <button id="joinBackBtn" class="secondaryBtn">
      برگشت
    </button>
  </section>
  <!-- GAME -->
  <section id="gameScreen" class="hidden">
    <div class="gameHeader">
      <div>
        <strong id="gameMode">
          🤖 بازی با کامپیوتر
        </strong>
        <div id="turnText">
          نوبت تو
        </div>
      </div>
      <div id="gameMessage">
        تاس را بزن
      </div>
    </div>
    <!-- OPPONENT -->
    <div class="playerArea opponentArea">
      <div class="playerTitle redTitle">
        🔴 کامپیوتر
      </div>
      <div class="home redHome">
        <div class="homeTitle">
          RED
        </div>
        <div class="homePieces">
          <button class="homePiece redPiece" data-player="1" data-piece="0"></button>
          <button class="homePiece redPiece" data-player="1" data-piece="1"></button>
          <button class="homePiece redPiece" data-player="1" data-piece="2"></button>
          <button class="homePiece redPiece" data-player="1" data-piece="3"></button>
        </div>
      </div>
      <div class="diceArea">
        <div class="diceHint" id="botHint">
          منتظر نوبت
        </div>
        <button id="botDice" class="diceBtn" disabled>
          ⚄
        </button>
      </div>
    </div>
    <!-- BOARD -->
    <div id="board" class="board">
      <div class="base baseRed"></div>
      <div class="base baseYellow"></div>
      <div class="base baseGreen"></div>
      <div class="base baseBlue"></div>
      <div class="track"></div>
      <div class="centerCup">
        <div class="cup">🏆</div>
      </div>
    </div>
    <!-- PLAYER -->
    <div class="playerArea playerAreaBottom">
      <div class="diceArea">
        <div class="diceHint active" id="playerHint">
          نوبت تو — تاس را بزن
        </div>
        <button id="playerDice" class="diceBtn">
          ⚄
        </button>
      </div>
      <div class="playerTitle blueTitle">
        🔵 تو
      </div>
      <div class="home blueHome">
        <div class="homeTitle">
          BLUE
        </div>
        <div class="homePieces">
          <button class="homePiece bluePiece" data-player="0" data-piece="0"></button>
          <button class="homePiece bluePiece" data-player="0" data-piece="1"></button>
          <button class="homePiece bluePiece" data-player="0" data-piece="2"></button>
          <button class="homePiece bluePiece" data-player="0" data-piece="3"></button>
        </div>
      </div>
    </div>
    <button id="gameBackBtn" class="secondaryBtn gameBack">
      خروج از بازی
    </button>
  </section>
  <!-- SETTINGS -->
  <section id="settings" class="modal hidden">
    <div class="settingsBox">
      <h2>⚙️ تنظیمات</h2>
      <button data-lang="fa">🇮🇷 فارسی</button>
      <button data-lang="en">🇬🇧 English</button>
      <button data-lang="de">🇩🇪 Deutsch</button>
      <button data-lang="ar">🇸🇦 العربية</button>
      <button data-lang="ru">🇷🇺 Русский</button>
      <button id="closeSettings">
        بستن
      </button>
    </div>
  </section>
</div>
<script src="game.js"></script>
</body>
</html>
